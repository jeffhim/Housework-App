<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>家務記錄 App</title>
    
    <!-- iOS PWA Configuration -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="家務記錄">
    <meta name="theme-color" content="#4CAF50">
    
    <!-- Your Custom iOS Icons -->
    <link rel="apple-touch-icon" sizes="180x180" href="./icon-192.png">
    <link rel="apple-touch-icon" sizes="152x152" href="./icon-192.png">
    <link rel="apple-touch-icon" sizes="144x144" href="./icon-192.png">
    <link rel="apple-touch-icon" sizes="120x120" href="./icon-192.png">
    <link rel="apple-touch-icon" sizes="114x114" href="./icon-192.png">
    <link rel="apple-touch-icon" sizes="76x76" href="./icon-192.png">
    <link rel="apple-touch-icon" sizes="72x72" href="./icon-192.png">
    <link rel="apple-touch-icon" sizes="60x60" href="./icon-192.png">
    <link rel="apple-touch-icon" sizes="57x57" href="./icon-192.png">
    
    <!-- Standard favicon -->
    <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
    <link rel="icon" type="image/png" sizes="32x32" href="./icon-192.png">
    <link rel="icon" type="image/png" sizes="16x16" href="./icon-192.png">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 0;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
            -webkit-text-size-adjust: 100%;
        }

        /* iOS Safe Area Support */
        .container {
            max-width: 400px;
            margin: 0 auto;
            background: white;
            border-radius: 0;
            box-shadow: none;
            min-height: 100vh;
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
        }

        .header {
            background: linear-gradient(135deg, #4CAF50, #45a049);
            color: white;
            padding: 40px 20px 30px;
            text-align: center;
            position: relative;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .balance-card {
            background: rgba(255,255,255,0.2);
            border-radius: 15px;
            padding: 20px;
            margin-top: 20px;
            backdrop-filter: blur(10px);
        }

        .balance-amount {
            font-size: 36px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .balance-label {
            opacity: 0.9;
            font-size: 14px;
        }

        .main-content {
            padding: 30px 20px;
        }

        .input-section {
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }

        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 15px;
            border: 2px solid #e1e5e9;
            border-radius: 12px;
            font-size: 16px;
            transition: all 0.3s ease;
            -webkit-appearance: none;
            appearance: none;
            background: white;
        }

        .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
            outline: none;
            border-color: #4CAF50;
            box-shadow: 0 0 0 3px rgba(76, 175, 80, 0.1);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }

        .btn {
            width: 100%;
            padding: 18px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 15px;
            -webkit-tap-highlight-color: transparent;
        }

        .btn-primary {
            background: linear-gradient(135deg, #4CAF50, #45a049);
            color: white;
        }

        .btn-primary:active {
            transform: scale(0.98);
        }

        .btn-secondary {
            background: #f8f9fa;
            color: #6c757d;
            border: 2px solid #e1e5e9;
        }

        .transactions-section {
            margin-top: 30px;
        }

        .section-title {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #333;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .transaction-item {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 15px;
            border-left: 4px solid #4CAF50;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .transaction-info h4 {
            margin-bottom: 5px;
            color: #333;
        }

        .transaction-info p {
            font-size: 14px;
            color: #6c757d;
            margin: 2px 0;
        }

        .transaction-amount {
            font-size: 18px;
            font-weight: bold;
            color: #4CAF50;
        }

        .delete-btn {
            background: #dc3545;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            margin-left: 10px;
            transition: all 0.3s ease;
            -webkit-tap-highlight-color: transparent;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #6c757d;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
        }

        .stat-amount {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 14px;
            color: #6c757d;
        }

        .income .stat-amount {
            color: #28a745;
        }

        .expense-stat .stat-amount {
            color: #dc3545;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 20px;
            margin: 20px;
            max-width: 400px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #6c757d;
            -webkit-tap-highlight-color: transparent;
        }

        .settlement-result {
            background: #e8f5e8;
            border: 2px solid #4CAF50;
            border-radius: 12px;
            padding: 20px;
            margin-top: 20px;
            text-align: center;
        }

        .settlement-amount {
            font-size: 28px;
            font-weight: bold;
            color: #4CAF50;
            margin-bottom: 10px;
        }

        /* iOS Status Bar Detection */
        @supports (padding-top: env(safe-area-inset-top)) {
            body {
                padding-top: env(safe-area-inset-top);
            }
        }

        /* Standalone mode detection */
        @media all and (display-mode: standalone) {
            .container {
                border-radius: 0;
            }
        }
    </style>

    <!-- Inline Manifest for PWA -->
    <script>
        // Create manifest with your custom icon
        const manifestData = {
            "name": "家務記錄 App",
            "short_name": "家務記錄",
            "description": "安全的家務記錄和結算應用程式",
            "start_url": "./",
            "display": "standalone",
            "background_color": "#ffffff",
            "theme_color": "#4CAF50",
            "orientation": "portrait",
            "scope": "./",
            "icons": [
                {
                    "src": "./icon-192.png",
                    "sizes": "192x192",
                    "type": "image/png"
                },
                {
                    "src": "./icon-192.png",
                    "sizes": "512x512",
                    "type": "image/png"
                },
                {
                    "src": "./icon-192.png",
                    "sizes": "180x180",
                    "type": "image/png"
                }
            ]
        };

        // Register manifest
        const manifestBlob = new Blob([JSON.stringify(manifestData)], { type: 'application/json' });
        const manifestURL = URL.createObjectURL(manifestBlob);
        
        const link = document.createElement('link');
        link.rel = 'manifest';
        link.href = manifestURL;
        document.head.appendChild(link);
    </script>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🏠 家務記錄</h1>
            <div class="balance-card">
                <div class="balance-amount" id="totalBalance">$0</div>
                <div class="balance-label">當前結餘</div>
            </div>
        </div>

        <div class="main-content">
            <!-- Statistics -->
            <div class="stats-grid">
                <div class="stat-card income">
                    <div class="stat-amount" id="totalIncome">$0</div>
                    <div class="stat-label">總收入</div>
                </div>
                <div class="stat-card expense-stat">
                    <div class="stat-amount" id="totalExpense">$0</div>
                    <div class="stat-label">總支出</div>
                </div>
            </div>

            <!-- Add Transaction Form -->
            <div class="input-section">
                <div class="form-group">
                    <label for="personSelect">選擇人員</label>
                    <select id="personSelect">
                        <option value="阿媽">阿媽</option>
                        <option value="老豆">老豆</option>
                        <option value="阿仔">阿仔</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="amountInput">金額</label>
                    <input type="number" id="amountInput" placeholder="請輸入金額" step="0.01" min="0">
                </div>

                <div class="form-group">
                    <label for="categorySelect">類別</label>
                    <select id="categorySelect">
                        <option value="食物">🍚 食物</option>
                        <option value="交通">🚌 交通</option>
                        <option value="日用品">🧴 日用品</option>
                        <option value="醫療">💊 醫療</option>
                        <option value="娛樂">🎮 娛樂</option>
                        <option value="其他">📦 其他</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="descriptionInput">描述 (選填)</label>
                    <textarea id="descriptionInput" placeholder="請輸入描述..."></textarea>
                </div>

                <button class="btn btn-primary" onclick="addTransaction()">
                    ➕ 新增記錄
                </button>

                <button class="btn btn-secondary" onclick="openSettlement()">
                    💰 結算帳目
                </button>
            </div>

            <!-- Transactions List -->
            <div class="transactions-section">
                <div class="section-title">
                    📋 最近記錄
                </div>
                <div id="transactionsList"></div>
            </div>
        </div>
    </div>

    <!-- Settlement Modal -->
    <div id="settlementModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>💰 結算帳目</h2>
                <button class="close-btn" onclick="closeSettlement()">&times;</button>
            </div>
            <div id="settlementContent"></div>
            <button class="btn btn-primary" onclick="clearAllData()" style="background: #dc3545; margin-top: 20px;">
                🗑️ 清空所有記錄
            </button>
        </div>
    </div>

    <script>
        // Global variables
        let transactions = JSON.parse(localStorage.getItem('transactions') || '[]');
        const people = ['阿媽', '老豆', '阿仔'];

        // Initialize app
        document.addEventListener('DOMContentLoaded', function() {
            loadTransactions();
            updateStats();
            
            // Check if running as standalone PWA
            if (window.navigator.standalone || window.matchMedia('(display-mode: standalone)').matches) {
                console.log('Running as standalone PWA! ✅');
                document.body.style.paddingTop = 'env(safe-area-inset-top)';
            }
        });

        // Add transaction
        function addTransaction() {
            const person = document.getElementById('personSelect').value;
            const amount = parseFloat(document.getElementById('amountInput').value);
            const category = document.getElementById('categorySelect').value;
            const description = document.getElementById('descriptionInput').value;

            if (!amount || amount <= 0) {
                alert('請輸入有效金額！');
                return;
            }

            const transaction = {
                id: Date.now(),
                person: person,
                amount: amount,
                category: category,
                description: description,
                date: new Date().toISOString(),
                timestamp: new Date().toLocaleString('zh-HK')
            };

            transactions.unshift(transaction);
            saveTransactions();
            loadTransactions();
            updateStats();
            clearForm();

            // Success feedback with haptic
            if (window.navigator.vibrate) {
                window.navigator.vibrate(100);
            }
            alert('記錄已成功新增！');
        }

        // Clear form
        function clearForm() {
            document.getElementById('amountInput').value = '';
            document.getElementById('descriptionInput').value = '';
        }

        // Save to localStorage
        function saveTransactions() {
            localStorage.setItem('transactions', JSON.stringify(transactions));
        }

        // Load transactions
        function loadTransactions() {
            const container = document.getElementById('transactionsList');
            
            if (transactions.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div style="font-size: 48px;">📝</div>
                        <p>暫無記錄</p>
                        <p style="font-size: 14px;">新增第一筆家務記錄吧！</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = transactions.map(transaction => `
                <div class="transaction-item">
                    <div class="transaction-info">
                        <h4>${getCategoryEmoji(transaction.category)} ${transaction.category}</h4>
                        <p><strong>${transaction.person}</strong> - $${transaction.amount.toFixed(2)}</p>
                        <p>${transaction.description || '無描述'}</p>
                        <p style="font-size: 12px; color: #999;">${transaction.timestamp}</p>
                    </div>
                    <div>
                        <div class="transaction-amount">$${transaction.amount.toFixed(2)}</div>
                        <button class="delete-btn" onclick="deleteTransaction(${transaction.id})">刪除</button>
                    </div>
                </div>
            `).join('');
        }

        // Get category emoji
        function getCategoryEmoji(category) {
            const emojis = {
                '食物': '🍚',
                '交通': '🚌',
                '日用品': '🧴',
                '醫療': '💊',
                '娛樂': '🎮',
                '其他': '📦'
            };
            return emojis[category] || '📦';
        }

        // Delete transaction
        function deleteTransaction(id) {
            if (confirm('確定要刪除這筆記錄嗎？')) {
                transactions = transactions.filter(t => t.id !== id);
                saveTransactions();
                loadTransactions();
                updateStats();
            }
        }

        // Update statistics
        function updateStats() {
            const total = transactions.reduce((sum, t) => sum + t.amount, 0);
            const totalByPerson = {};
            
            people.forEach(person => {
                totalByPerson[person] = transactions
                    .filter(t => t.person === person)
                    .reduce((sum, t) => sum + t.amount, 0);
            });

            document.getElementById('totalBalance').textContent = `$${total.toFixed(2)}`;
            document.getElementById('totalIncome').textContent = `$${total.toFixed(2)}`;
            document.getElementById('totalExpense').textContent = `${transactions.length} 筆`;
        }

        // Open settlement modal
        function openSettlement() {
            const modal = document.getElementById('settlementModal');
            const content = document.getElementById('settlementContent');
            
            if (transactions.length === 0) {
                content.innerHTML = `
                    <div class="empty-state">
                        <p>暫無記錄可結算</p>
                    </div>
                `;
            } else {
                const totalByPerson = {};
                people.forEach(person => {
                    totalByPerson[person] = transactions
                        .filter(t => t.person === person)
                        .reduce((sum, t) => sum + t.amount, 0);
                });

                const total = Object.values(totalByPerson).reduce((sum, amount) => sum + amount, 0);
                const average = total / people.length;

                content.innerHTML = `
                    <div class="stats-grid" style="grid-template-columns: 1fr;">
                        ${people.map(person => `
                            <div class="stat-card">
                                <div class="stat-amount" style="color: ${totalByPerson[person] >= average ? '#28a745' : '#dc3545'}">
                                    $${totalByPerson[person].toFixed(2)}
                                </div>
                                <div class="stat-label">${person}</div>
                                <div style="font-size: 12px; color: #6c757d; margin-top: 5px;">
                                    ${totalByPerson[person] >= average ? '多付' : '少付'} $${Math.abs(totalByPerson[person] - average).toFixed(2)}
                                </div>
                            </div>
                        `).join('')}
                    </div>
                    
                    <div class="settlement-result">
                        <div class="settlement-amount">總支出: $${total.toFixed(2)}</div>
                        <div>平均每人: $${average.toFixed(2)}</div>
                        <div style="margin-top: 15px; font-size: 14px;">
                            <strong>結算建議:</strong><br>
                            ${people.map(person => {
                                const diff = totalByPerson[person] - average;
                                if (Math.abs(diff) < 0.01) return `${person}: 已平衡 ✅`;
                                return diff > 0 
                                    ? `${person}: 應收回 $${diff.toFixed(2)} 💰`
                                    : `${person}: 應付出 $${Math.abs(diff).toFixed(2)} 💳`;
                            }).join('<br>')}
                        </div>
                    </div>
                `;
            }
            
            modal.style.display = 'flex';
        }

        // Close settlement modal
        function closeSettlement() {
            document.getElementById('settlementModal').style.display = 'none';
        }

        // Clear all data
        function clearAllData() {
            if (confirm('確定要清空所有記錄嗎？此操作無法恢復！')) {
                transactions = [];
                saveTransactions();
                loadTransactions();
                updateStats();
                closeSettlement();
                alert('所有記錄已清空！');
            }
        }

        // Close modal when clicking outside
        window.onclick = function(event) {
            const modal = document.getElementById('settlementModal');
            if (event.target === modal) {
                closeSettlement();
            }
        }
    </script>
</body>
</html>
