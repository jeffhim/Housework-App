<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>🏮 亂道場の修行列表</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&family=Ma+Shan+Zheng&display=swap" rel="stylesheet">
    
    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';
        import { getFirestore, doc, setDoc, getDoc, collection, onSnapshot, serverTimestamp, query, orderBy, limit, deleteDoc } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';
        
        window.firebaseModules = {
            initializeApp,
            getAuth,
            signInWithPopup,
            GoogleAuthProvider,
            onAuthStateChanged,
            signOut,
            getFirestore,
            doc,
            setDoc,
            getDoc,
            collection,
            onSnapshot,
            serverTimestamp,
            query,
            orderBy,
            limit,
            deleteDoc
        };
    </script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body { 
            font-family: 'Noto Serif TC', '瀨戶字體', 'Microsoft JhengHei', serif;
            background: linear-gradient(135deg, #2C1810 0%, #3E2723 20%, #4E342E 50%, #5D4037 80%, #6D4C41 100%);
            min-height: 100vh;
            color: #EFEBE9;
            padding: 0 0 120px 0;
            position: relative;
            overflow-x: hidden;
        }

        /* 🎋 竹子背景裝飾 */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(90deg, rgba(139,195,74,0.05) 1px, transparent 1px),
                linear-gradient(0deg, rgba(139,195,74,0.05) 1px, transparent 1px),
                radial-gradient(circle at 15% 25%, rgba(255,193,7,0.08) 0%, transparent 40%),
                radial-gradient(circle at 85% 75%, rgba(255,152,0,0.06) 0%, transparent 40%);
            background-size: 40px 40px, 40px 40px, 800px 800px, 800px 800px;
            pointer-events: none;
            z-index: -2;
        }

        /* 🎨 紙質紋理 */
        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(circle at 20% 80%, rgba(255,235,59,0.03) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(255,193,7,0.04) 0%, transparent 50%),
                radial-gradient(circle at 40% 40%, rgba(139,69,19,0.05) 0%, transparent 30%);
            pointer-events: none;
            z-index: -1;
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
            position: relative;
            z-index: 1;
        }
        
        /* 🏮 道場標題樣式 */
        .header {
            text-align: center;
            margin-bottom: 30px;
            background: linear-gradient(135deg, rgba(62,39,35,0.95), rgba(78,52,46,0.9));
            backdrop-filter: blur(15px);
            border-radius: 25px;
            padding: 30px;
            box-shadow: 
                0 8px 32px rgba(0,0,0,0.4),
                inset 0 2px 4px rgba(255,193,7,0.1);
            border: 2px solid rgba(255,193,7,0.3);
            position: relative;
        }

        .header::before {
            content: '🏮';
            position: absolute;
            top: -15px;
            left: 20px;
            font-size: 2em;
            transform: rotate(-15deg);
        }

        .header::after {
            content: '⛩️';
            position: absolute;
            top: -15px;
            right: 20px;
            font-size: 2em;
            transform: rotate(15deg);
        }
        
        .header h1 {
            font-family: 'Ma Shan Zheng', 'Noto Serif TC', serif;
            font-size: 2em;
            margin-bottom: 12px;
            background: linear-gradient(45deg, #FFD700, #FFA000, #FF8F00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 700;
            text-shadow: 2px 2px 6px rgba(255,193,7,0.3);
            letter-spacing: 3px;
        }

        .header p {
            font-size: 1.4em;
            color: #FFAB40;
            font-weight: 600;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.5);
        }

        .user-info {
            background: rgba(62,39,35,0.8);
            padding: 12px 18px;
            border-radius: 20px;
            margin-top: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            border: 1px solid rgba(255,193,7,0.2);
        }

        .user-avatar {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #FFD700;
        }

        .user-name {
            font-weight: 700;
            color: #FFAB40;
            font-size: 1.1em;
        }
        
        /* 🎯 卡片樣式優化 */
        .status-bar, .card {
            background: linear-gradient(135deg, rgba(62,39,35,0.95), rgba(78,52,46,0.9));
            padding: 25px;
            border-radius: 25px;
            margin-bottom: 25px;
            box-shadow: 
                0 8px 32px rgba(0,0,0,0.3),
                inset 0 2px 4px rgba(255,193,7,0.1);
            backdrop-filter: blur(15px);
            border: 2px solid rgba(255,193,7,0.2);
            transition: all 0.4s ease;
            position: relative;
        }

        .card::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: linear-gradient(45deg, #FFD700, transparent, #FFA000, transparent, #FFD700);
            border-radius: 25px;
            z-index: -1;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .card:hover::before {
            opacity: 0.3;
        }

        .card:hover {
            transform: translateY(-3px);
            box-shadow: 
                0 12px 40px rgba(0,0,0,0.4),
                inset 0 2px 8px rgba(255,193,7,0.15);
        }

        /* 🏯 今日修行總結 */
        .today-summary {
            background: linear-gradient(135deg, rgba(46,24,16,0.95), rgba(62,39,35,0.9));
            border-radius: 25px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 
                0 8px 32px rgba(0,0,0,0.4),
                inset 0 2px 4px rgba(255,193,7,0.15);
            border: 2px solid rgba(255,152,0,0.4);
            position: relative;
        }

        .today-summary::before {
            content: '📊';
            position: absolute;
            top: 10px;
            right: 20px;
            font-size: 1.5em;
        }

        .summary-title {
            font-family: 'Ma Shan Zheng', serif;
            font-size: 1.4em;
            font-weight: 700;
            color: #FFD700;
            margin-bottom: 20px;
            text-align: center;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            letter-spacing: 2px;
        }

        .summary-content {
            display: flex;
            gap: 20px;
            justify-content: space-around;
        }

        .person-summary {
            flex: 1;
            text-align: center;
            padding: 20px;
            background: rgba(78,52,46,0.7);
            border-radius: 20px;
            border: 2px solid rgba(255,193,7,0.2);
            position: relative;
        }

        .person-summary::before {
            content: attr(data-person);
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(45deg, #FFD700, #FFA000);
            color: #2C1810;
            padding: 5px 15px;
            border-radius: 15px;
            font-size: 0.9em;
            font-weight: 700;
        }

        .person-name {
            font-family: 'Ma Shan Zheng', serif;
            font-weight: 700;
            font-size: 1.2em;
            margin: 15px 0 10px 0;
            color: #FFAB40;
            letter-spacing: 1px;
        }

        .completed-tasks {
            font-size: 0.95em;
            color: #BCAAA4;
            line-height: 1.5;
            margin-bottom: 8px;
        }

        .task-count {
            font-weight: 600;
            color: #FFD700;
            margin: 8px 0;
            font-size: 1em;
        }

        .earned-today {
            font-size: 1.3em;
            font-weight: 700;
            color: #4CAF50;
            margin-top: 10px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
        }

        /* 🎯 債務顯示優化 */
        .debt-section {
            background: linear-gradient(135deg, rgba(46,24,16,0.95), rgba(62,39,35,0.9));
            border-radius: 25px;
            padding: 30px;
            margin-bottom: 25px;
            border: 2px solid rgba(255,87,34,0.4);
            box-shadow: 
                0 8px 32px rgba(0,0,0,0.4),
                inset 0 2px 4px rgba(255,87,34,0.1);
            position: relative;
        }

        .debt-section::before {
            content: '⚖️';
            position: absolute;
            top: 15px;
            right: 25px;
            font-size: 1.8em;
        }

        .debt-display {
            text-align: center;
            font-size: 1.5em;
            font-weight: 700;
            margin-bottom: 25px;
            padding: 20px;
            border-radius: 15px;
            background: rgba(78,52,46,0.8);
            border: 2px solid rgba(255,87,34,0.4);
            font-family: 'Ma Shan Zheng', serif;
            letter-spacing: 1px;
        }

        .debt-balanced {
            color: #4CAF50;
            border-color: rgba(76,175,80,0.5);
            background: rgba(27,94,32,0.2);
            text-shadow: 0 0 10px rgba(76,175,80,0.3);
        }

        .debt-owed {
            color: #FF5722;
            border-color: rgba(255,87,34,0.5);
            background: rgba(183,28,28,0.2);
            text-shadow: 0 0 10px rgba(255,87,34,0.3);
        }

        /* 💰 轉賬表單優化 */
        .payment-form {
            background: rgba(78,52,46,0.8);
            border-radius: 20px;
            padding: 30px;
            border: 2px solid rgba(255,193,7,0.3);
            margin-bottom: 25px;
        }

        .form-title {
            font-family: 'Ma Shan Zheng', serif;
            font-size: 1.3em;
            font-weight: 700;
            color: #FFD700;
            margin-bottom: 25px;
            text-align: center;
            padding-bottom: 15px;
            border-bottom: 2px solid rgba(255,193,7,0.3);
            letter-spacing: 1px;
        }
        
        /* 📱 底部標籤優化 - 增加高度避免iPhone底部功能衝突 */
        .tabs {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            display: flex;
            background: linear-gradient(135deg, rgba(46,24,16,0.98), rgba(62,39,35,0.95));
            backdrop-filter: blur(20px);
            border-top: 3px solid rgba(255,193,7,0.4);
            box-shadow: 
                0 -8px 32px rgba(0,0,0,0.4),
                inset 0 2px 4px rgba(255,193,7,0.1);
            z-index: 1000;
            height: 100px; /* 增加高度 */
            align-items: center;
            padding-bottom: env(safe-area-inset-bottom, 20px); /* iPhone安全區域 */
        }
        
        .tab {
            flex: 1;
            height: 80px; /* 增加可點擊區域 */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.4s ease;
            color: #BCAAA4;
            font-weight: 600;
            font-size: 0.85em;
            border-radius: 0;
            position: relative;
            margin: 10px 5px;
            border-radius: 15px;
        }

        .tab::before {
            content: attr(data-icon);
            font-size: 1.8em;
            margin-bottom: 4px;
            transition: all 0.3s ease;
        }
        
        .tab.active {
            background: linear-gradient(45deg, rgba(255,193,7,0.3), rgba(255,152,0,0.2));
            color: #FFD700;
            box-shadow: 
                0 4px 20px rgba(255,193,7,0.3),
                inset 0 2px 4px rgba(255,193,7,0.2);
            border: 1px solid rgba(255,193,7,0.4);
            transform: scale(1.05);
        }

        .tab.active::before {
            transform: scale(1.1);
            text-shadow: 0 0 8px rgba(255,193,7,0.5);
        }

        .tab:hover:not(.active) {
            background: rgba(78,52,46,0.5);
            color: #FFAB40;
            transform: scale(1.02);
        }
        
        .tab-content {
            display: none;
        }
        
        .tab-content.active {
            display: block;
        }
        
        /* 🎯 任務項目樣式 */
        .task-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 25px;
            border: 2px solid rgba(255,193,7,0.3);
            border-radius: 20px;
            margin-bottom: 20px;
            transition: all 0.4s ease;
            background: linear-gradient(135deg, rgba(78,52,46,0.8), rgba(93,64,55,0.6));
            position: relative;
        }

        .task-item::before {
            content: '';
            position: absolute;
            top: 10px;
            left: 20px;
            width: 6px;
            height: 6px;
            background: #FFD700;
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(255,215,0,0.5);
        }
        
        .task-item:hover {
            border-color: rgba(255,152,0,0.6);
            box-shadow: 
                0 8px 25px rgba(0,0,0,0.3),
                inset 0 2px 4px rgba(255,193,7,0.1);
            transform: translateY(-3px);
        }
        
        .task-info {
            flex: 1;
            padding-left: 20px;
        }
        
        .task-name {
            font-family: 'Ma Shan Zheng', serif;
            font-weight: 700;
            margin-bottom: 10px;
            color: #EFEBE9;
            font-size: 1.2em;
            letter-spacing: 1px;
        }
        
        .task-completion-status {
            font-size: 0.95em;
            color: #BCAAA4;
            font-weight: 500;
            line-height: 1.5;
        }

        .completion-count {
            display: inline-block;
            background: linear-gradient(45deg, rgba(76,175,80,0.3), rgba(139,195,74,0.2));
            color: #4CAF50;
            padding: 4px 10px;
            border-radius: 15px;
            font-size: 0.85em;
            font-weight: 700;
            margin-right: 8px;
            border: 1px solid rgba(76,175,80,0.4);
            text-shadow: 0 0 5px rgba(76,175,80,0.3);
        }
        
        .task-actions {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }
        
        /* 🎯 按鈕樣式優化 */
        .complete-btn {
            background: linear-gradient(45deg, rgba(76,175,80,0.8), rgba(56,142,60,0.9));
            color: white;
            border: none;
            padding: 12px 18px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 700;
            transition: all 0.3s ease;
            font-size: 0.9em;
            min-width: 85px;
            font-family: 'Noto Serif TC', serif;
            border: 1px solid rgba(76,175,80,0.4);
            box-shadow: 0 4px 15px rgba(76,175,80,0.2);
        }
        
        .complete-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(76,175,80,0.4);
            background: linear-gradient(45deg, rgba(56,142,60,0.9), rgba(46,125,50,1));
            text-shadow: 0 0 8px rgba(255,255,255,0.3);
        }

        .delete-btn {
            background: linear-gradient(45deg, rgba(244,67,54,0.8), rgba(198,40,40,0.9));
            color: white;
            border: none;
            padding: 10px 14px;
            border-radius: 18px;
            cursor: pointer;
            font-weight: 700;
            transition: all 0.3s ease;
            font-size: 0.8em;
            font-family: 'Noto Serif TC', serif;
            border: 1px solid rgba(244,67,54,0.4);
            box-shadow: 0 4px 15px rgba(244,67,54,0.2);
        }

        .delete-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(244,67,54,0.4);
            background: linear-gradient(45deg, rgba(198,40,40,0.9), rgba(183,28,28,1));
        }
        
        .money-badge {
            background: linear-gradient(45deg, #FFD700, #FFA000);
            color: #2C1810;
            padding: 10px 16px;
            border-radius: 20px;
            font-size: 1em;
            font-weight: 700;
            margin-right: 15px;
            box-shadow: 
                0 4px 15px rgba(255,193,7,0.3),
                inset 0 2px 4px rgba(255,255,255,0.2);
            border: 1px solid rgba(255,152,0,0.3);
            text-shadow: 0 1px 2px rgba(0,0,0,0.2);
        }
        
        /* 📝 輸入框樣式 */
        .input-group {
            margin-bottom: 25px;
        }
        
        .input-group label {
            display: block;
            margin-bottom: 10px;
            font-weight: 700;
            color: #FFAB40;
            font-size: 1.1em;
            font-family: 'Ma Shan Zheng', serif;
            letter-spacing: 1px;
        }
        
        .input-group input, .input-group select {
            width: 100%;
            padding: 18px;
            border: 2px solid rgba(255,193,7,0.4);
            border-radius: 15px;
            font-size: 16px;
            transition: all 0.3s ease;
            background: rgba(78,52,46,0.8);
            font-family: 'Noto Serif TC', serif;
            color: #EFEBE9;
            backdrop-filter: blur(10px);
        }

        .input-group input::placeholder {
            color: #BCAAA4;
        }
        
        .input-group input:focus, .input-group select:focus {
            outline: none;
            border-color: rgba(255,152,0,0.8);
            box-shadow: 
                0 0 20px rgba(255,193,7,0.3),
                inset 0 2px 4px rgba(255,193,7,0.1);
            background: rgba(93,64,55,0.9);
        }
        
        /* 🎯 主要按鈕樣式 */
        .btn {
            background: linear-gradient(45deg, rgba(255,152,0,0.8), rgba(230,126,34,0.9));
            color: white;
            border: none;
            padding: 18px 35px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 700;
            font-size: 16px;
            transition: all 0.4s ease;
            width: 100%;
            margin-top: 20px;
            font-family: 'Noto Serif TC', serif;
            border: 1px solid rgba(255,152,0,0.4);
            box-shadow: 0 6px 20px rgba(255,152,0,0.3);
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(255,152,0,0.5);
            background: linear-gradient(45deg, rgba(230,126,34,0.9), rgba(211,84,0,1));
            text-shadow: 0 0 10px rgba(255,255,255,0.3);
        }
        
        .btn-danger {
            background: linear-gradient(45deg, rgba(244,67,54,0.8), rgba(198,40,40,0.9));
            border-color: rgba(244,67,54,0.4);
            box-shadow: 0 6px 20px rgba(244,67,54,0.3);
        }
        
        .btn-danger:hover {
            box-shadow: 0 10px 30px rgba(244,67,54,0.5);
            background: linear-gradient(45deg, rgba(198,40,40,0.9), rgba(183,28,28,1));
        }

        .btn-success {
            background: linear-gradient(45deg, rgba(76,175,80,0.8), rgba(56,142,60,0.9));
            border-color: rgba(76,175,80,0.4);
            box-shadow: 0 6px 20px rgba(76,175,80,0.3);
            margin-top: 20px;
        }

        .btn-success:hover {
            background: linear-gradient(45deg, rgba(56,142,60,0.9), rgba(46,125,50,1));
            box-shadow: 0 10px 30px rgba(76,175,80,0.5);
        }

        /* 🔐 Google登入按鈕 */
        .google-login-btn {
            background: linear-gradient(45deg, rgba(66,133,244,0.8), rgba(53,122,232,0.9));
            color: white;
            border: none;
            padding: 18px 35px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 700;
            font-size: 16px;
            transition: all 0.4s ease;
            width: 100%;
            margin-top: 20px;
            font-family: 'Noto Serif TC', serif;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            border: 1px solid rgba(66,133,244,0.4);
            box-shadow: 0 6px 20px rgba(66,133,244,0.3);
        }

        .google-login-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(66,133,244,0.5);
            background: linear-gradient(45deg, rgba(53,122,232,0.9), rgba(26,115,232,1));
        }
        
        /* 📜 歷史記錄 */
        .history-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            border-left: 4px solid #FFD700;
            background: linear-gradient(135deg, rgba(78,52,46,0.8), rgba(93,64,55,0.6));
            margin-bottom: 15px;
            border-radius: 0 15px 15px 0;
            transition: all 0.3s ease;
            border-top: 1px solid rgba(255,193,7,0.2);
            border-bottom: 1px solid rgba(255,193,7,0.2);
            border-right: 1px solid rgba(255,193,7,0.2);
        }

        .history-item:hover {
            background: linear-gradient(135deg, rgba(93,64,55,0.9), rgba(109,76,65,0.7));
            box-shadow: 0 6px 20px rgba(255,193,7,0.2);
            transform: translateX(5px);
        }
        
        .history-info {
            flex: 1;
            font-weight: 600;
            color: #EFEBE9;
            line-height: 1.4;
        }
        
        .history-time {
            font-size: 0.85em;
            color: #BCAAA4;
            margin-left: 15px;
            font-weight: 500;
        }
        
        /* 💰 餘額顯示 */
        .balance-display {
            display: flex;
            justify-content: space-around;
            margin-bottom: 30px;
            gap: 20px;
        }
        
        .balance-card {
            text-align: center;
            padding: 25px;
            background: linear-gradient(135deg, #FFD700 0%, #FFA000 100%);

    <script>
        // 🔥 Firebase 配置
        const firebaseConfig = {
            apiKey: "AIzaSyCTBIi5ZSNG0Ow7DlyCkKcKXevPJJay3t8",
            authDomain: "housework-app-4c138.firebaseapp.com",
            projectId: "housework-app-4c138",
            storageBucket: "housework-app-4c138.firebasestorage.app",
            messagingSenderId: "61329794359",
            appId: "1:61329794359:web:8706f20ba899909e86e6b2"
        };

        // 🔐 允許登入的帳戶
        const ALLOWED_EMAILS = [
            'jeffhimcch@gmail.com',      // 子謙 的 Gmail
            'dorothylaw0603@gmail.com'   // 小亂 的 Gmail
        ];
        
        // 全域變數
        let app, auth, db, provider;
        let currentUser = null;
        let tasks = [];
        let completions = [];
        let payments = [];
        let unsubscribeFunctions = [];

        // 🚀 Firebase 初始化
        async function initializeFirebase() {
            try {
                const {
                    initializeApp,
                    getAuth,
                    signInWithPopup,
                    GoogleAuthProvider,
                    onAuthStateChanged,
                    signOut,
                    getFirestore,
                    doc,
                    setDoc,
                    getDoc,
                    collection,
                    onSnapshot,
                    serverTimestamp,
                    query,
                    orderBy,
                    limit,
                    deleteDoc
                } = window.firebaseModules;

                // 初始化 Firebase
                app = initializeApp(firebaseConfig);
                auth = getAuth(app);
                db = getFirestore(app);
                provider = new GoogleAuthProvider();

                console.log('✅ Firebase 初始化成功');
                
                // 監聽登入狀態
                onAuthStateChanged(auth, async (user) => {
                    if (user && ALLOWED_EMAILS.includes(user.email)) {
                        console.log('✅ 修行者已登入:', user.email);
                        currentUser = user;
                        await showMainApp();
                        await loadDataFromFirebase();
                        updateSyncStatus('🔄 同步中...');
                        setupRealtimeListeners();
                    } else if (user && !ALLOWED_EMAILS.includes(user.email)) {
                        console.log('❌ 未授權的修行者:', user.email);
                        showError('此帳戶未獲得道場入門許可');
                        await signOut(auth);
                        showLoginScreen();
                    } else {
                        console.log('👤 修行者未登入');
                        showLoginScreen();
                    }
                });

                updateSyncStatus('✅ 道場連線成功');
                
            } catch (error) {
                console.error('❌ Firebase 初始化失敗:', error);
                updateSyncStatus('❌ 道場連線失敗');
                showError('道場連線失敗: ' + error.message);
            }
        }

        // 🔐 Google 登入
        async function signInWithGoogle() {
            try {
                showLoading('正在進入道場...');
                const { signInWithPopup } = window.firebaseModules;
                const result = await signInWithPopup(auth, provider);
                const user = result.user;

                if (!ALLOWED_EMAILS.includes(user.email)) {
                    await auth.signOut();
                    hideLoading();
                    showError('此帳戶未獲得道場入門許可\n允許的修行者: ' + ALLOWED_EMAILS.join(', '));
                    return;
                }

                console.log('✅ 道場登入成功:', user.email);
                hideLoading();
                
            } catch (error) {
                console.error('❌ 道場登入失敗:', error);
                hideLoading();
                showError('道場登入失敗: ' + error.message);
            }
        }

        // 🏠 顯示主應用
        async function showMainApp() {
            document.getElementById('loginContainer').style.display = 'none';
            document.getElementById('mainContainer').style.display = 'block';
            document.getElementById('tabsContainer').style.display = 'flex';
            document.getElementById('logoutBtn').style.display = 'block';

            // 顯示用戶資訊
            if (currentUser) {
                document.getElementById('userInfo').style.display = 'flex';
                document.getElementById('userName').textContent = currentUser.displayName || currentUser.email;
                if (currentUser.photoURL) {
                    document.getElementById('userAvatar').src = currentUser.photoURL;
                }
                document.getElementById('welcomeMessage').textContent = `歡迎回到道場，${getUserNickname()}師傅！`;
            }
        }

        // 🏠 顯示登入畫面
        function showLoginScreen() {
            document.getElementById('loginContainer').style.display = 'flex';
            document.getElementById('mainContainer').style.display = 'none';
            document.getElementById('tabsContainer').style.display = 'none';
            document.getElementById('logoutBtn').style.display = 'none';
            currentUser = null;
        }

        // 👤 獲取用戶暱稱
        function getUserNickname() {
            if (!currentUser) return '';
            
            if (currentUser.email === 'jeffhimcch@gmail.com') {
                return '子謙';
            } else if (currentUser.email === 'dorothylaw0603@gmail.com') {
                return '小亂';
            }
            return currentUser.displayName || 'Unknown';
        }

        // ☁️ 從 Firebase 載入資料
        async function loadDataFromFirebase() {
            try {
                const { getDoc, doc } = window.firebaseModules;
                
                // 載入任務
                const tasksDoc = await getDoc(doc(db, 'doujou', 'tasks'));
                if (tasksDoc.exists()) {
                    tasks = tasksDoc.data().list || [];
                } else {
                    tasks = getDefaultTasks();
                    await saveToFirebase();
                }

                // 載入完成記錄
                const completionsDoc = await getDoc(doc(db, 'doujou', 'completions'));
                if (completionsDoc.exists()) {
                    completions = completionsDoc.data().list || [];
                } else {
                    completions = [];
                }

                // 載入轉賬記錄
                const paymentsDoc = await getDoc(doc(db, 'doujou', 'payments'));
                if (paymentsDoc.exists()) {
                    payments = paymentsDoc.data().list || [];
                } else {
                    payments = [];
                }

                updateUI();
                console.log('✅ 道場資料載入成功');
                
            } catch (error) {
                console.error('❌ 道場資料載入失敗:', error);
                showError('資料載入失敗，使用本地備份');
                loadLocalBackup();
            }
        }

        // 💾 儲存到 Firebase
        async function saveToFirebase() {
            if (!currentUser) return;
            
            try {
                const { setDoc, doc, serverTimestamp } = window.firebaseModules;
                
                await setDoc(doc(db, 'doujou', 'tasks'), {
                    list: tasks,
                    lastUpdated: serverTimestamp(),
                    updatedBy: currentUser.email
                });

                await setDoc(doc(db, 'doujou', 'completions'), {
                    list: completions,
                    lastUpdated: serverTimestamp(),
                    updatedBy: currentUser.email
                });

                await setDoc(doc(db, 'doujou', 'payments'), {
                    list: payments,
                    lastUpdated: serverTimestamp(),
                    updatedBy: currentUser.email
                });

                saveLocalBackup();
                updateSyncStatus('✅ 道場同步完成');
                
            } catch (error) {
                console.error('❌ 道場同步失敗:', error);
                updateSyncStatus('❌ 同步失敗');
                saveLocalBackup();
                showError('雲端同步失敗，已儲存到本地道場');
            }
        }

        // 📡 設置實時監聽
        function setupRealtimeListeners() {
            const { onSnapshot, doc } = window.firebaseModules;
            
            unsubscribeFunctions.forEach(unsubscribe => unsubscribe());
            unsubscribeFunctions = [];
            
            try {
                const unsubscribeTasks = onSnapshot(doc(db, 'doujou', 'tasks'), (docSnapshot) => {
                    if (docSnapshot.exists()) {
                        const data = docSnapshot.data();
                        if (data.updatedBy !== currentUser.email) {
                            tasks = data.list || [];
                            updateTaskList();
                            updateTodaySummary();
                        }
                    }
                });
                unsubscribeFunctions.push(unsubscribeTasks);

                const unsubscribeCompletions = onSnapshot(doc(db, 'doujou', 'completions'), (docSnapshot) => {
                    if (docSnapshot.exists()) {
                        const data = docSnapshot.data();
                        if (data.updatedBy !== currentUser.email) {
                            completions = data.list || [];
                            updateBalance();
                            updateHistory();
                            updateTodaySummary();
                            updateDebtDisplay();
                        }
                    }
                });
                unsubscribeFunctions.push(unsubscribeCompletions);

                const unsubscribePayments = onSnapshot(doc(db, 'doujou', 'payments'), (docSnapshot) => {
                    if (docSnapshot.exists()) {
                        const data = docSnapshot.data();
                        if (data.updatedBy !== currentUser.email) {
                            payments = data.list || [];
                            updateHistory();
                            updateDebtDisplay();
                        }
                    }
                });
                unsubscribeFunctions.push(unsubscribePayments);

                console.log('✅ 道場實時監聽器設置完成');
                
            } catch (error) {
                console.error('❌ 實時監聽器設置失敗:', error);
            }
        }

        // 💾 本地備份
        function saveLocalBackup() {
            localStorage.setItem('doujou_tasks', JSON.stringify(tasks));
            localStorage.setItem('doujou_completions', JSON.stringify(completions));
            localStorage.setItem('doujou_payments', JSON.stringify(payments));
        }

        function loadLocalBackup() {
            tasks = JSON.parse(localStorage.getItem('doujou_tasks')) || getDefaultTasks();
            completions = JSON.parse(localStorage.getItem('doujou_completions')) || [];
            payments = JSON.parse(localStorage.getItem('doujou_payments')) || [];
        }

        // 🏠 預設任務
        function getDefaultTasks() {
            return [
                { id: '1', name: '洗碗禪修', points: 5.0 },
                { id: '2', name: '倒垃圾冥想', points: 3.0 },
                { id: '3', name: '掃地修行', points: 8.0 },
                { id: '4', name: '洗衣靜心', points: 12.0 },
                { id: '5', name: '整理道場', points: 15.0 }
            ];
        }

        // 🔧 工具函數
        function generateId() {
            return Date.now().toString() + Math.random().toString(36).substr(2, 9);
        }

        function formatDateTime(dateTime) {
            const date = new Date(dateTime);
            return date.toLocaleString('zh-HK', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        // 🎯 核心功能函數
        function switchTab(tabName) {
            document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            
            event.target.closest('.tab').classList.add('active');
            document.getElementById(tabName).classList.add('active');
            
            if (tabName === 'payment') {
                updateDebtDisplay();
            }
        }

        function addTask() {
            const name = document.getElementById('taskName').value.trim();
            const points = parseFloat(document.getElementById('taskPoints').value);

            if (!name) {
                showError('請輸入修行項目名稱');
                return;
            }

            if (!points || points <= 0) {
                showError('請輸入有效的獎金金額');
                return;
            }

            const task = {
                id: generateId(),
                name,
                points,
                createdBy: currentUser.email,
                createdAt: new Date().toISOString()
            };

            tasks.push(task);
            
            document.getElementById('taskName').value = '';
            document.getElementById('taskPoints').value = '5.0';
            
            updateTaskList();
            saveToFirebase();
            showSuccess('修行項目創建成功！道場已更新。');
        }

        function deleteTask(taskId) {
            if (!confirm('確定要刪除這個修行項目嗎？相關的完成記錄也會被永久移除。')) {
                return;
            }

            tasks = tasks.filter(task => task.id !== taskId);
            completions = completions.filter(completion => completion.taskId !== taskId);
            
            updateTaskList();
            updateBalance();
            updateHistory();
            updateTodaySummary();
            updateDebtDisplay();
            saveToFirebase();
            
            showSuccess('修行項目已從道場中移除！');
        }

        function completeTask(taskId, completedBy) {
            if (!currentUser) {
                showError('請先登入道場');
                return;
            }

            const task = tasks.find(t => t.id === taskId);
            if (!task) {
                showError('找不到該修行項目');
                return;
            }

            const completion = {
                id: generateId(),
                taskId: taskId,
                completedBy: completedBy,
                completedAt: new Date().toISOString(),
                points: task.points,
                recordedBy: currentUser.email
            };

            completions.push(completion);
            
            updateTaskList();
            updateBalance();
            updateHistory();
            updateTodaySummary();
            updateDebtDisplay();
            saveToFirebase();
            
            showSuccess(`🎉 ${completedBy}師傅完成「${task.name}」修行，獲得 $${task.points} 修行金！✨`);
        }

        function setTransfer(from, to) {
            document.querySelectorAll('.quick-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            
            document.getElementById('paymentFrom').value = from;
            document.getElementById('paymentTo').value = to;
        }

        function recordPayment() {
            const from = document.getElementById('paymentFrom').value;
            const to = document.getElementById('paymentTo').value;
            const amount = parseFloat(document.getElementById('paymentAmount').value);

            if (!from || !to) {
                showError('請選擇轉出者和接受者');
                return;
            }

            if (from === to) {
                showError('轉出者和接受者不能是同一人');
                return;
            }

            if (!amount || amount <= 0) {
                showError('請輸入有效轉移金額');
                return;
            }

            const payment = {
                id: generateId(),
                from: from,
                to: to,
                amount: amount,
                date: new Date().toISOString(),
                reason: '修行金平衡轉移',
                recordedBy: currentUser.email
            };

            payments.push(payment);
            
            document.getElementById('paymentFrom').value = '';
            document.getElementById('paymentTo').value = '';
            document.getElementById('paymentAmount').value = '';
            
            document.querySelectorAll('.quick-btn').forEach(btn => btn.classList.remove('active'));
            
            updateBalance();
            updateHistory();
            updateDebtDisplay();
            saveToFirebase();
            
            showSuccess(`💰 記錄成功：${from} → ${to} $${amount.toFixed(2)} 修行金轉移完成`);
        }

        // 🔄 界面更新函數
        function updateUI() {
            if (!currentUser) return;
            
            updateTaskList();
            updateBalance();
            updateHistory();
            updateDebtDisplay();
            updateTodaySummary();
        }

        function updateTodaySummary() {
            const today = new Date().toDateString();
            const todayCompletions = completions.filter(c => new Date(c.completedAt).toDateString() === today);
            
            // 子謙 今日總結
            const ziqianToday = todayCompletions.filter(c => c.completedBy === '子謙');
            const ziqianTasksEl = document.getElementById('ziqianTodayTasks');
            const ziqianCountEl = document.getElementById('ziqianTaskCount');
            const ziqianEarnedEl = document.getElementById('ziqianEarnedToday');
            
            if (ziqianToday.length > 0) {
                const taskNames = ziqianToday.map(c => {
                    const task = tasks.find(t => t.id === c.taskId);
                    return task ? task.name : '已刪除修行';
                }).slice(0, 3);
                
                ziqianTasksEl.textContent = taskNames.join('、') + (ziqianToday.length > 3 ? '...' : '');
                ziqianCountEl.textContent = `${ziqianToday.length}項修行`;
                
                const earned = ziqianToday.reduce((sum, c) => sum + c.points, 0);
                ziqianEarnedEl.textContent = `+$${earned.toFixed(2)}`;
            } else {
                ziqianTasksEl.textContent = '今日尚未開始修行';
                ziqianCountEl.textContent = '0項修行';
                ziqianEarnedEl.textContent = '$0.00';
            }
            
            // 小亂 今日總結
            const xiaoluanToday = todayCompletions.filter(c => c.completedBy === '小亂');
            const xiaoluanTasksEl = document.getElementById('xiaoluanTodayTasks');
            const xiaoluanCountEl = document.getElementById('xiaoluanTaskCount');
            const xiaoluanEarnedEl = document.getElementById('xiaoluanEarnedToday');
            
            if (xiaoluanToday.length > 0) {
                const taskNames = xiaoluanToday.map(c => {
                    const task = tasks.find(t => t.id === c.taskId);
                    return task ? task.name : '已刪除修行';
                }).slice(0, 3);
                
                xiaoluanTasksEl.textContent = taskNames.join('、') + (xiaoluanToday.length > 3 ? '...' : '');
                xiaoluanCountEl.textContent = `${xiaoluanToday.length}項修行`;
                
                const earned = xiaoluanToday.reduce((sum, c) => sum + c.points, 0);
                xiaoluanEarnedEl.textContent = `+$${earned.toFixed(2)}`;
            } else {
                xiaoluanTasksEl.textContent = '今日尚未開始修行';
                xiaoluanCountEl.textContent = '0項修行';
                xiaoluanEarnedEl.textContent = '$0.00';
            }
        }

        function updateTaskList() {
            const taskListEl = document.getElementById('taskList');
            if (!taskListEl) return;
            
            if (tasks.length === 0) {
                taskListEl.innerHTML = '<p style="text-align: center; color: #BCAAA4; font-style: italic; font-size: 1.1em;">道場暫無修行項目，請先創建一些任務開始修行之旅！</p>';
                return;
            }
            
            taskListEl.innerHTML = tasks.map(task => {
                const taskCompletions = completions.filter(c => c.taskId === task.id);
                const today = new Date().toDateString();
                const todayCompletions = taskCompletions.filter(c => new Date(c.completedAt).toDateString() === today);
                
                const ziqianToday = todayCompletions.filter(c => c.completedBy === '子謙').length;
                const xiaoluanToday = todayCompletions.filter(c => c.completedBy === '小亂').length;
                
                return `
                    <div class="task-item">
                        <div class="task-info">
                            <div class="task-name">${task.name}</div>
                            <div class="task-completion-status">
                                今日完成：
                                ${ziqianToday > 0 ? `<span class="completion-count">子謙師傅 ${ziqianToday}次</span>` : ''}
                                ${xiaoluanToday > 0 ? `<span class="completion-count">小亂師傅 ${xiaoluanToday}次</span>` : ''}
                                ${ziqianToday === 0 && xiaoluanToday === 0 ? '等待修行者挑戰' : ''}
                            </div>
                        </div>
                        <div class="task-actions">
                            <div class="money-badge">$${task.points}</div>
                            <button class="complete-btn" onclick="completeTask('${task.id}', '子謙')">子謙完成</button>
                            <button class="complete-btn" onclick="completeTask('${task.id}', '小亂')">小亂完成</button>
                            <button class="delete-btn" onclick="deleteTask('${task.id}')">🗑️</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function updateBalance() {
            // 計算修行總收入
            const ziqianEarned = completions.filter(c => c.completedBy === '子謙').reduce((sum, c) => sum + c.points, 0);
            const xiaoluanEarned = completions.filter(c => c.completedBy === '小亂').reduce((sum, c) => sum + c.points, 0);
            
            // 計算轉賬調整
            const ziqianReceived = payments.filter(p => p.to === '子謙').reduce((sum, p) => sum + p.amount, 0);
            const ziqianPaid = payments.filter(p => p.from === '子謙').reduce((sum, p) => sum + p.amount, 0);
            const xiaoluanReceived = payments.filter(p => p.to === '小亂').reduce((sum, p) => sum + p.amount, 0);
            const xiaoluanPaid = payments.filter(p => p.from === '小亂').reduce((sum, p) => sum + p.amount, 0);
            
            // 計算最終餘額（修行收入 + 收到轉賬 - 支付轉賬）
            const ziqianBalance = ziqianEarned + ziqianReceived - ziqianPaid;
            const xiaoluanBalance = xiaoluanEarned + xiaoluanReceived - xiaoluanPaid;
            
            // 更新顯示
            document.getElementById('ziqianBalance').textContent = `$${ziqianBalance.toFixed(2)}`;
            document.getElementById('xiaoluanBalance').textContent = `$${xiaoluanBalance.toFixed(2)}`;
        }

        // 🎯 修正債務計算邏輯
        function updateDebtDisplay() {
            // 計算每人的修行總收入
            const ziqianEarned = completions.filter(c => c.completedBy === '子謙').reduce((sum, c) => sum + c.points, 0);
            const xiaoluanEarned = completions.filter(c => c.completedBy === '小亂').reduce((sum, c) => sum + c.points, 0);
            
            // 理想情況：每人應該得到的平均金額
            const totalEarned = ziqianEarned + xiaoluanEarned;
            const idealAmount = totalEarned / 2;
            
            // 計算每人應收或應付的金額
            const ziqianShouldReceive = idealAmount - ziqianEarned;  // 負值表示應該給出
            const xiaoluanShouldReceive = idealAmount - xiaoluanEarned;  // 負值表示應該給出
            
            // 計算已經轉賬的金額
            const ziqianReceived = payments.filter(p => p.to === '子謙').reduce((sum, p) => sum + p.amount, 0);
            const ziqianPaid = payments.filter(p => p.from === '子謙').reduce((sum, p) => sum + p.amount, 0);
            const xiaoluanReceived = payments.filter(p => p.to === '小亂').reduce((sum, p) => sum + p.amount, 0);
            const xiaoluanPaid = payments.filter(p => p.from === '小亂').reduce((sum, p) => sum + p.amount, 0);
            
            // 計算淨轉賬金額
            const ziqianNetReceived = ziqianReceived - ziqianPaid;
            const xiaoluanNetReceived = xiaoluanReceived - xiaoluanPaid;
            
            // 計算剩餘應收/應付金額
            const ziqianStillOwes = ziqianShouldReceive - ziqianNetReceived;
            const xiaoluanStillOwes = xiaoluanShouldReceive - xiaoluanNetReceived;
            
            const debtEl = document.getElementById('debtDisplay');
            
            if (Math.abs(ziqianStillOwes) < 0.01) {
                debtEl.textContent = '⚖️ 修行金已完美平衡！';
                debtEl.className = 'debt-display debt-balanced';
            } else if (ziqianStillOwes > 0) {
                // 子謙應該收錢，意味著小亂還欠子謙錢
                debtEl.textContent = `⚖️ 小亂師傅 欠 子謙師傅 $${Math.abs(ziqianStillOwes).toFixed(2)}`;
                debtEl.className = 'debt-display debt-owed';
            } else {
                // 子謙應該給錢，意味著子謙還欠小亂錢
                debtEl.textContent = `⚖️ 子謙師傅 欠 小亂師傅 $${Math.abs(ziqianStillOwes).toFixed(2)}`;
                debtEl.className = 'debt-display debt-owed';
            }
        }

        function updateHistory() {
            // 更新完成記錄
            const completionHistoryEl = document.getElementById('completionHistory');
            if (completionHistoryEl) {
                const recentCompletions = completions.slice(-25).reverse();
                completionHistoryEl.innerHTML = recentCompletions.map(completion => {
                    const task = tasks.find(t => t.id === completion.taskId);
                    const taskName = task ? task.name : '已刪除的修行';
                    return `
                        <div class="history-item">
                            <div class="history-info">
                                🎯 ${completion.completedBy}師傅 完成「${taskName}」修行 (+$${completion.points})
                            </div>
                            <div class="history-time">${formatDateTime(completion.completedAt)}</div>
                        </div>
                    `;
                }).join('') || '<p style="text-align: center; color: #BCAAA4; font-style: italic;">道場尚無修行記錄</p>';
            }
            
            // 更新轉賬記錄
            const paymentHistoryEl = document.getElementById('paymentHistory');
            if (paymentHistoryEl) {
                const recentPayments = payments.slice(-25).reverse();
                paymentHistoryEl.innerHTML = recentPayments.map(payment => `
                    <div class="history-item">
                        <div class="history-info">
                            💰 ${payment.from}師傅 → ${payment.to}師傅: $${payment.amount.toFixed(2)}
                            <small style="display: block; color: #BCAAA4; margin-top: 4px;">${payment.reason}</small>
                        </div>
                        <div class="history-time">${formatDateTime(payment.date)}</div>
                    </div>
                `).join('') || '<p style="text-align: center; color: #BCAAA4; font-style: italic;">道場尚無轉移記錄</p>';
            }
        }

        // 🚨 系統函數
        function showLoading(message = '道場連接中...') {
            document.getElementById('loadingText').textContent = message;
            document.getElementById('loadingScreen').style.display = 'flex';
        }

        function hideLoading() {
            document.getElementById('loadingScreen').style.display = 'none';
        }

        function showSuccess(message) {
            const alert = document.createElement('div');
            alert.className = 'alert alert-success';
            alert.textContent = message;
            document.body.appendChild(alert);
            setTimeout(() => alert.remove(), 4000);
        }

        function showError(message) {
            const alert = document.createElement('div');
            alert.className = 'alert alert-error';
            alert.textContent = message;
            document.body.appendChild(alert);
            setTimeout(() => alert.remove(), 6000);
        }

        function updateSyncStatus(status) {
            const syncEl = document.getElementById('syncStatus');
            syncEl.textContent = status;
            
            syncEl.classList.remove('sync-error');
            if (status.includes('❌') || status.includes('失敗')) {
                syncEl.classList.add('sync-error');
            }
        }

        async function logout() {
            if (confirm('確定要離開道場嗎？修行數據已安全儲存。')) {
                try {
                    const { signOut } = window.firebaseModules;
                    
                    unsubscribeFunctions.forEach(unsubscribe => unsubscribe());
                    unsubscribeFunctions = [];
                    
                    await signOut(auth);
                    currentUser = null;
                    showLoginScreen();
                    updateSyncStatus('🔄 道場連接中...');
                } catch (error) {
                    console.error('離開道場失敗:', error);
                    showError('離開道場失敗');
                }
            }
        }

        async function resetData() {
            if (!confirm('⚠️ 確定要重置道場所有資料嗎？此操作將清空所有修行記錄！')) {
                return;
            }
            
            if (!confirm('🚨 最後確認：這將永久刪除所有修行項目、完成記錄和轉移記錄！')) {
                return;
            }
            
            tasks = [];
            completions = [];
            payments = [];
            
            updateUI();
            await saveToFirebase();
            showSuccess('🔄 道場已重置，所有修行記錄已清空');
        }

        // 🚀 應用初始化
        document.addEventListener('DOMContentLoaded', async function() {
            console.log('🏮 亂道場の修行列表 正在啟動...');
            
            showLoading('初始化道場系統...');
            
            let retryCount = 0;
            const maxRetries = 50;
            
            const waitForFirebase = () => {
                return new Promise((resolve, reject) => {
                    const checkModules = () => {
                        if (window.firebaseModules) {
                            resolve();
                        } else if (retryCount < maxRetries) {
                            retryCount++;
                            setTimeout(checkModules, 100);
                        } else {
                            reject(new Error('Firebase 道場系統載入超時'));
                        }
                    };
                    checkModules();
                });
            };
            
            try {
                await waitForFirebase();
                await initializeFirebase();
                hideLoading();
                console.log('🏮 道場系統初始化完成！');
            } catch (error) {
                console.error('道場初始化失敗:', error);
                hideLoading();
                updateSyncStatus('❌ 道場初始化失敗');
                showError('道場系統初始化失敗: ' + error.message);
            }
        });
    </script>
</body>
