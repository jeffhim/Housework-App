<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏮 亂道場の修行列表</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600&display=swap" rel="stylesheet">
    
    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';
        import { getFirestore, doc, setDoc, getDoc, collection, onSnapshot, serverTimestamp, query, orderBy, limit, deleteDoc } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';
        
        window.firebaseModules = {
            initializeApp,
            getAuth,
            signInWithPopup,
            GoogleAuthProvider,
            onAuthStateChanged,
            signOut,
            getFirestore,
            doc,
            setDoc,
            getDoc,
            collection,
            onSnapshot,
            serverTimestamp,
            query,
            orderBy,
            limit,
            deleteDoc
        };
    </script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body { 
            font-family: 'Noto Serif TC', '瀨戶字體', 'Microsoft JhengHei', serif;
            background: linear-gradient(135deg, #FFF8E1 0%, #FFF3E0 30%, #FCF3CF 70%, #F8F4E6 100%);
            min-height: 100vh;
            color: #6D4C41;
            padding: 0 0 80px 0;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(circle at 20% 50%, rgba(255,241,118,0.08) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(255,204,128,0.08) 0%, transparent 50%),
                radial-gradient(circle at 40% 80%, rgba(251,192,147,0.06) 0%, transparent 50%);
            pointer-events: none;
            z-index: -1;
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
            position: relative;
            z-index: 1;
        }
        
        .header {
            text-align: center;
            margin-bottom: 30px;
            background: rgba(255,253,236,0.85);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 25px 30px;
            box-shadow: 0 6px 25px rgba(205,180,119,0.15);
            border: 1px solid rgba(255,245,157,0.3);
        }
        
        .header h1 {
            font-size: 1.8em;
            margin-bottom: 8px;
            background: linear-gradient(45deg, #D4AC0D, #F1C40F, #F39C12);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 600;
            text-shadow: 1px 1px 3px rgba(212,172,13,0.2);
        }

        .header p {
            font-size: 1.3em;
            color: #E67E22;
            font-weight: 600;
            text-shadow: 1px 1px 2px rgba(230,126,34,0.15);
        }

        .user-info {
            background: rgba(255,251,235,0.8);
            padding: 10px 15px;
            border-radius: 15px;
            margin-top: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .user-avatar {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            object-fit: cover;
        }

        .user-name {
            font-weight: 600;
            color: #6D4C41;
        }
        
        .status-bar {
            background: rgba(255,253,236,0.9);
            padding: 20px;
            border-radius: 20px;
            margin-bottom: 25px;
            box-shadow: 0 6px 25px rgba(205,180,119,0.12);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255,245,157,0.25);
        }
        
        .card {
            background: rgba(255,253,236,0.9);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 6px 25px rgba(205,180,119,0.12);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255,245,157,0.25);
            transition: all 0.3s ease;
        }

        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(205,180,119,0.18);
        }

        .today-summary {
            background: linear-gradient(135deg, rgba(255,249,196,0.9) 0%, rgba(255,245,157,0.9) 100%);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 20px rgba(212,172,13,0.15);
            border: 1px solid rgba(241,196,15,0.3);
        }

        .summary-title {
            font-size: 1.2em;
            font-weight: 600;
            color: #B7950B;
            margin-bottom: 15px;
            text-align: center;
        }

        .summary-content {
            display: flex;
            gap: 20px;
            justify-content: space-around;
        }

        .person-summary {
            flex: 1;
            text-align: center;
            padding: 15px;
            background: rgba(255,255,255,0.6);
            border-radius: 15px;
            border: 1px solid rgba(241,196,15,0.2);
        }

        .person-name {
            font-weight: 600;
            font-size: 1.1em;
            margin-bottom: 8px;
            color: #7D6608;
        }

        .completed-tasks {
            font-size: 0.95em;
            color: #A9790B;
            line-height: 1.4;
        }

        .task-count {
            font-weight: 600;
            color: #D4AC0D;
            margin-top: 5px;
        }

        .earned-today {
            font-size: 1.2em;
            font-weight: 700;
            color: #2E7D32;
            margin-top: 8px;
        }
        
        .tabs {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            display: flex;
            background: rgba(255,253,236,0.95);
            backdrop-filter: blur(15px);
            border-top: 2px solid rgba(241,196,15,0.25);
            box-shadow: 0 -6px 25px rgba(205,180,119,0.15);
            z-index: 1000;
            height: 60px;
            align-items: center;
        }
        
        .tab {
            flex: 1;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            color: #A9790B;
            font-weight: 600;
            font-size: 0.9em;
            border-radius: 0;
            position: relative;
        }
        
        .tab.active {
            background: linear-gradient(45deg, #F7DC6F, #F4D03F);
            color: #7D6608;
            box-shadow: 0 4px 15px rgba(212,172,13,0.2);
        }
        
        .tab-content {
            display: none;
        }
        
        .tab-content.active {
            display: block;
        }
        
        .task-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px;
            border: 2px solid rgba(248,196,113,0.4);
            border-radius: 15px;
            margin-bottom: 15px;
            transition: all 0.3s ease;
            background: linear-gradient(135deg, rgba(255,255,255,0.8) 0%, rgba(255,251,235,0.8) 100%);
        }
        
        .task-item:hover {
            border-color: rgba(229,177,58,0.6);
            box-shadow: 0 6px 20px rgba(205,180,119,0.2);
            transform: translateY(-2px);
        }
        
        .task-info {
            flex: 1;
        }
        
        .task-name {
            font-weight: 600;
            margin-bottom: 8px;
            color: #6D4C41;
            font-size: 1.1em;
        }
        
        .task-completion-status {
            font-size: 0.95em;
            color: #8D6E63;
            font-weight: 500;
            line-height: 1.4;
        }

        .completion-count {
            display: inline-block;
            background: linear-gradient(45deg, #E8F5E8, #C8E6C9);
            color: #2E7D32;
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 0.85em;
            font-weight: 600;
            margin-right: 8px;
            border: 1px solid rgba(76,175,80,0.2);
        }
        
        .task-actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        
        .complete-btn {
            background: linear-gradient(45deg, #81C784, #66BB6A);
            color: white;
            border: none;
            padding: 12px 18px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            font-size: 0.9em;
            min-width: 80px;
            font-family: 'Noto Serif TC', serif;
        }
        
        .complete-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(129,199,132,0.4);
            background: linear-gradient(45deg, #66BB6A, #4CAF50);
        }

        .delete-btn {
            background: linear-gradient(45deg, #E74C3C, #C0392B);
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            font-size: 0.8em;
            font-family: 'Noto Serif TC', serif;
        }

        .delete-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(231,76,60,0.4);
            background: linear-gradient(45deg, #C0392B, #A93226);
        }
        
        .money-badge {
            background: linear-gradient(45deg, #FFF176, #FFEB3B);
            color: #F57F17;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 0.95em;
            font-weight: 700;
            margin-right: 15px;
            box-shadow: 0 3px 10px rgba(255,235,59,0.3);
            border: 1px solid rgba(249,168,37,0.2);
        }
        
        .input-group {
            margin-bottom: 20px;
        }
        
        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #6D4C41;
            font-size: 1.05em;
        }
        
        .input-group input, .input-group select {
            width: 100%;
            padding: 15px;
            border: 2px solid rgba(248,196,113,0.4);
            border-radius: 12px;
            font-size: 16px;
            transition: all 0.3s ease;
            background: rgba(255,255,255,0.9);
            font-family: 'Noto Serif TC', serif;
            color: #6D4C41;
        }
        
        .input-group input:focus, .input-group select:focus {
            outline: none;
            border-color: rgba(229,177,58,0.6);
            box-shadow: 0 0 15px rgba(205,180,119,0.2);
        }
        
        .btn {
            background: linear-gradient(45deg, #E67E22, #D68910);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 600;
            font-size: 16px;
            transition: all 0.3s ease;
            width: 100%;
            margin-top: 15px;
            font-family: 'Noto Serif TC', serif;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(230,126,34,0.4);
        }
        
        .btn-danger {
            background: linear-gradient(45deg, #E74C3C, #C0392B);
        }
        
        .btn-danger:hover {
            box-shadow: 0 8px 25px rgba(231,76,60,0.4);
        }

        .btn-success {
            background: linear-gradient(45deg, #81C784, #66BB6A);
            margin-top: 15px;
        }

        .btn-success:hover {
            background: linear-gradient(45deg, #66BB6A, #4CAF50);
            box-shadow: 0 8px 25px rgba(129,199,132,0.4);
        }

        .google-login-btn {
            background: linear-gradient(45deg, #4285F4, #357AE8);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 600;
            font-size: 16px;
            transition: all 0.3s ease;
            width: 100%;
            margin-top: 15px;
            font-family: 'Noto Serif TC', serif;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .google-login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(66,133,244,0.4);
        }
        
        .history-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            border-left: 4px solid #F7DC6F;
            background: linear-gradient(135deg, rgba(255,251,235,0.8) 0%, rgba(255,255,255,0.8) 100%);
            margin-bottom: 10px;
            border-radius: 0 12px 12px 0;
            transition: all 0.3s ease;
        }

        .history-item:hover {
            background: linear-gradient(135deg, rgba(255,251,235,1) 0%, rgba(255,255,255,1) 100%);
            box-shadow: 0 4px 15px rgba(247,220,111,0.2);
        }
        
        .history-info {
            flex: 1;
            font-weight: 500;
            color: #6D4C41;
        }
        
        .history-time {
            font-size: 0.85em;
            color: #A9790B;
            margin-left: 15px;
        }
        
        .balance-display {
            display: flex;
            justify-content: space-around;
            margin-bottom: 25px;
            gap: 15px;
        }
        
        .balance-card {
            text-align: center;
            padding: 20px;
            background: linear-gradient(135deg, #F7DC6F 0%, #F4D03F 100%);
            color: #7D6608;
            border-radius: 20px;
            flex: 1;
            box-shadow: 0 6px 20px rgba(212,172,13,0.25);
            transition: all 0.3s ease;
            border: 1px solid rgba(241,196,15,0.2);
        }

        .balance-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(212,172,13,0.3);
        }
        
        .balance-amount {
            font-size: 1.8em;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .balance-label {
            font-size: 1.1em;
            font-weight: 500;
        }
        
        .loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(109,76,65,0.9);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            backdrop-filter: blur(8px);
        }
        
        .loading-content {
            background: rgba(255,253,236,0.95);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            font-family: 'Noto Serif TC', serif;
            color: #6D4C41;
        }
        
        .spinner {
            border: 4px solid rgba(248,196,113,0.3);
            border-top: 4px solid #F4D03F;
            border-radius: 50%;
            width: 45px;
            height: 45px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .alert {
            padding: 15px;
            margin: 15px 0;
            border-radius: 12px;
            font-weight: 600;
            backdrop-filter: blur(10px);
            font-family: 'Noto Serif TC', serif;
        }
        
        .alert-success {
            background: rgba(232,245,233,0.9);
            color: #2E7D32;
            border: 1px solid rgba(129,199,132,0.5);
        }
        
        .alert-error {
            background: rgba(255,235,238,0.9);
            color: #C62828;
            border: 1px solid rgba(239,83,80,0.5);
        }
        
        .logout-btn {
            position: fixed;
            top: 25px;
            right: 25px;
            background: rgba(255,253,236,0.9);
            color: #6D4C41;
            border: 2px solid #F7DC6F;
            padding: 10px 20px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            font-family: 'Noto Serif TC', serif;
        }
        
        .logout-btn:hover {
            background: #F7DC6F;
            color: #7D6608;
            transform: translateY(-2px);
        }

        .sync-status {
            position: fixed;
            bottom: 70px;
            right: 25px;
            background: rgba(76,175,80,0.9);
            color: white;
            padding: 8px 12px;
            border-radius: 20px;
            font-size: 0.8em;
            box-shadow: 0 4px 15px rgba(76,175,80,0.3);
            backdrop-filter: blur(10px);
            font-weight: 600;
            font-family: 'Noto Serif TC', serif;
        }

        .sync-error {
            background: rgba(244,67,54,0.9) !important;
        }

        .debt-section {
            background: linear-gradient(135deg, rgba(255,245,238,0.9) 0%, rgba(255,248,225,0.9) 100%);
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 25px;
            border: 1px solid rgba(255,193,7,0.3);
            box-shadow: 0 4px 20px rgba(205,180,119,0.1);
        }

        .debt-display {
            text-align: center;
            font-size: 1.4em;
            font-weight: 700;
            margin-bottom: 20px;
            padding: 15px;
            border-radius: 12px;
            background: rgba(255,255,255,0.8);
            border: 2px solid rgba(255,193,7,0.4);
        }

        .debt-positive {
            color: #2E7D32;
            border-color: rgba(76,175,80,0.4) !important;
            background: rgba(232,245,233,0.9) !important;
        }

        .debt-negative {
            color: #E65100;
            border-color: rgba(255,87,34,0.4) !important;
            background: rgba(255,243,224,0.9) !important;
        }

        .payment-form {
            background: rgba(255,255,255,0.8);
            border-radius: 15px;
            padding: 25px;
            border: 1px solid rgba(255,193,7,0.3);
            margin-bottom: 20px;
        }

        .form-title {
            font-size: 1.2em;
            font-weight: 600;
            color: #6D4C41;
            margin-bottom: 20px;
            text-align: center;
            padding-bottom: 10px;
            border-bottom: 2px solid rgba(247,220,111,0.3);
        }

        .transfer-inputs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        .amount-input {
            grid-column: span 2;
        }

        .quick-actions {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .quick-btn {
            flex: 1;
            min-width: 120px;
            padding: 12px 20px;
            border: 2px solid rgba(248,196,113,0.6);
            border-radius: 25px;
            background: rgba(255,251,235,0.9);
            color: #6D4C41;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            font-family: 'Noto Serif TC', serif;
            font-size: 0.95em;
        }

        .quick-btn:hover {
            background: #F7DC6F;
            border-color: rgba(212,172,13,0.8);
            transform: translateY(-2px);
        }

        .quick-btn.active {
            background: linear-gradient(45deg, #F7DC6F, #F4D03F);
            border-color: #D4AC0D;
            color: #7D6608;
        }

        .login-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(255,248,225,0.95), rgba(255,243,224,0.95));
            z-index: 10000;
            display: flex;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(10px);
            font-family: 'Noto Serif TC', serif;
        }

        .login-card {
            background: rgba(255,253,236,0.95);
            padding: 50px;
            border-radius: 25px;
            box-shadow: 0 20px 60px rgba(205,180,119,0.3);
            text-align: center;
            max-width: 450px;
            width: 90%;
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255,245,157,0.4);
        }

        .login-title {
            margin: 0;
            color: #6D4C41;
            font-size: 2.2em;
            font-weight: 700;
            background: linear-gradient(45deg, #D4AC0D, #F39C12);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 30px;
        }

        .login-subtitle {
            color: #A9790B;
            margin-bottom: 35px;
            font-size: 1.1em;
            font-weight: 500;
        }

        .login-note {
            padding: 20px;
            background: rgba(255,248,225,0.8);
            border-radius: 15px;
            border-left: 4px solid #F7DC6F;
            margin-top: 25px;
        }

        .login-note-text {
            font-size: 0.95em;
            color: #A9790B;
            display: flex;
            align-items: center;
            font-weight: 500;
        }

        .login-note-text span {
            margin-right: 10px;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.5em;
            }
            
            .header p {
                font-size: 1.1em;
            }
            
            .tabs {
                height: 50px;
            }
            
            .tab {
                font-size: 0.8em;
            }

            body {
                padding-bottom: 60px;
            }

            .summary-content {
                flex-direction: column;
                gap: 10px;
            }

            .transfer-inputs {
                grid-template-columns: 1fr;
                gap: 10px;
            }

            .amount-input {
                grid-column: span 1;
            }

            .quick-actions {
                flex-direction: column;
            }

            .quick-btn {
                min-width: auto;
            }

            .task-actions {
                flex-direction: column;
                gap: 5px;
            }
        }

        @media (max-width: 480px) {
            .header h1 {
                font-size: 1.3em;
            }
            
            .tab {
                font-size: 0.7em;
            }
        }
    </style>
</head>
<body>
    <!-- 登出按鈕 -->
    <button class="logout-btn" onclick="logout()" style="display: none;" id="logoutBtn">🚪 離開道場</button>
    
    <!-- 同步狀態 -->
    <div class="sync-status" id="syncStatus">🔄 連接中...</div>
    
    <!-- 登入畫面 -->
    <div class="login-container" id="loginContainer">
        <div class="login-card">
            <h2 class="login-title">🏮 進入道場</h2>

    <script>
        // 🔥 Firebase 配置
        const firebaseConfig = {
            apiKey: "AIzaSyCTBIi5ZSNG0Ow7DlyCkKcKXevPJJay3t8",
            authDomain: "housework-app-4c138.firebaseapp.com",
            projectId: "housework-app-4c138",
            storageBucket: "housework-app-4c138.firebasestorage.app",
            messagingSenderId: "61329794359",
            appId: "1:61329794359:web:8706f20ba899909e86e6b2"
        };

        // 🔐 允許登入的帳戶（Email 保持不變，顯示名稱已更新）
        const ALLOWED_EMAILS = [
            'jeffhimcch@gmail.com',      // 子謙 的 Gmail
            'dorothylaw0603@gmail.com'   // 小亂 的 Gmail
        ];
        
        // 全域變數
        let app, auth, db, provider;
        let currentUser = null;
        let tasks = [];
        let completions = [];
        let payments = [];
        let unsubscribeFunctions = [];

        // 🚀 Firebase 初始化
        async function initializeFirebase() {
            try {
                const {
                    initializeApp,
                    getAuth,
                    signInWithPopup,
                    GoogleAuthProvider,
                    onAuthStateChanged,
                    signOut,
                    getFirestore,
                    doc,
                    setDoc,
                    getDoc,
                    collection,
                    onSnapshot,
                    serverTimestamp,
                    query,
                    orderBy,
                    limit,
                    deleteDoc
                } = window.firebaseModules;

                // 初始化 Firebase
                app = initializeApp(firebaseConfig);
                auth = getAuth(app);
                db = getFirestore(app);
                provider = new GoogleAuthProvider();

                console.log('✅ Firebase 初始化成功');
                
                // 監聽登入狀態
                onAuthStateChanged(auth, async (user) => {
                    if (user && ALLOWED_EMAILS.includes(user.email)) {
                        console.log('✅ 用戶已登入:', user.email);
                        currentUser = user;
                        await showMainApp();
                        await loadDataFromFirebase();
                        updateSyncStatus('🔄 同步中...');
                        setupRealtimeListeners();
                    } else if (user && !ALLOWED_EMAILS.includes(user.email)) {
                        console.log('❌ 未授權的帳戶:', user.email);
                        showError('此帳戶未獲得道場授權');
                        await signOut(auth);
                        showLoginScreen();
                    } else {
                        console.log('👤 用戶未登入');
                        showLoginScreen();
                    }
                });

                updateSyncStatus('✅ Firebase 連線');
                
            } catch (error) {
                console.error('❌ Firebase 初始化失敗:', error);
                updateSyncStatus('❌ 連線失敗');
                showError('Firebase 連線失敗: ' + error.message);
            }
        }

        // 🔐 Google 登入
        async function signInWithGoogle() {
            try {
                showLoading('正在登入...');
                const { signInWithPopup } = window.firebaseModules;
                const result = await signInWithPopup(auth, provider);
                const user = result.user;

                if (!ALLOWED_EMAILS.includes(user.email)) {
                    await auth.signOut();
                    hideLoading();
                    showError('此帳戶未獲得道場授權\n允許的帳戶: ' + ALLOWED_EMAILS.join(', '));
                    return;
                }

                console.log('✅ 登入成功:', user.email);
                hideLoading();
                
            } catch (error) {
                console.error('❌ 登入失敗:', error);
                hideLoading();
                showError('登入失敗: ' + error.message);
            }
        }

        // 🏠 顯示主應用
        async function showMainApp() {
            document.getElementById('loginContainer').style.display = 'none';
            document.getElementById('mainContainer').style.display = 'block';
            document.getElementById('tabsContainer').style.display = 'flex';
            document.getElementById('logoutBtn').style.display = 'block';

            // 顯示用戶資訊
            if (currentUser) {
                document.getElementById('userInfo').style.display = 'flex';
                document.getElementById('userName').textContent = currentUser.displayName || currentUser.email;
                if (currentUser.photoURL) {
                    document.getElementById('userAvatar').src = currentUser.photoURL;
                }
                document.getElementById('welcomeMessage').textContent = `歡迎回到道場，${getUserNickname()}！`;
            }
        }

        // 🏠 顯示登入畫面
        function showLoginScreen() {
            document.getElementById('loginContainer').style.display = 'flex';
            document.getElementById('mainContainer').style.display = 'none';
            document.getElementById('tabsContainer').style.display = 'none';
            document.getElementById('logoutBtn').style.display = 'none';
            currentUser = null;
        }

        // 👤 獲取用戶暱稱（更新為新名稱）
        function getUserNickname() {
            if (!currentUser) return '';
            
            if (currentUser.email === 'jeffhimcch@gmail.com') {
                return '子謙';
            } else if (currentUser.email === 'dorothylaw0603@gmail.com') {
                return '小亂';
            }
            return currentUser.displayName || 'Unknown';
        }

        // ☁️ 從 Firebase 載入資料
        async function loadDataFromFirebase() {
            try {
                const { getDoc, doc } = window.firebaseModules;
                
                // 載入任務
                const tasksDoc = await getDoc(doc(db, 'doujou', 'tasks'));
                if (tasksDoc.exists()) {
                    tasks = tasksDoc.data().list || [];
                } else {
                    tasks = getDefaultTasks();
                    await saveToFirebase();
                }

                // 載入完成記錄
                const completionsDoc = await getDoc(doc(db, 'doujou', 'completions'));
                if (completionsDoc.exists()) {
                    completions = completionsDoc.data().list || [];
                } else {
                    completions = [];
                }

                // 載入轉賬記錄
                const paymentsDoc = await getDoc(doc(db, 'doujou', 'payments'));
                if (paymentsDoc.exists()) {
                    payments = paymentsDoc.data().list || [];
                } else {
                    payments = [];
                }

                updateUI();
                console.log('✅ Firebase 資料載入成功');
                
            } catch (error) {
                console.error('❌ Firebase 資料載入失敗:', error);
                showError('資料載入失敗，使用本地備份');
                loadLocalBackup();
            }
        }

        // 💾 儲存到 Firebase
        async function saveToFirebase() {
            if (!currentUser) return;
            
            try {
                const { setDoc, doc, serverTimestamp } = window.firebaseModules;
                
                await setDoc(doc(db, 'doujou', 'tasks'), {
                    list: tasks,
                    lastUpdated: serverTimestamp(),
                    updatedBy: currentUser.email
                });

                await setDoc(doc(db, 'doujou', 'completions'), {
                    list: completions,
                    lastUpdated: serverTimestamp(),
                    updatedBy: currentUser.email
                });

                await setDoc(doc(db, 'doujou', 'payments'), {
                    list: payments,
                    lastUpdated: serverTimestamp(),
                    updatedBy: currentUser.email
                });

                saveLocalBackup();
                updateSyncStatus('✅ 已同步');
                
            } catch (error) {
                console.error('❌ Firebase 儲存失敗:', error);
                updateSyncStatus('❌ 同步失敗');
                saveLocalBackup();
                showError('雲端同步失敗，已儲存到本地');
            }
        }

        // 📡 設置實時監聽
        function setupRealtimeListeners() {
            const { onSnapshot, doc } = window.firebaseModules;
            
            unsubscribeFunctions.forEach(unsubscribe => unsubscribe());
            unsubscribeFunctions = [];
            
            try {
                const unsubscribeTasks = onSnapshot(doc(db, 'doujou', 'tasks'), (docSnapshot) => {
                    if (docSnapshot.exists()) {
                        const data = docSnapshot.data();
                        if (data.updatedBy !== currentUser.email) {
                            tasks = data.list || [];
                            updateTaskList();
                            updateTodaySummary();
                        }
                    }
                });
                unsubscribeFunctions.push(unsubscribeTasks);

                const unsubscribeCompletions = onSnapshot(doc(db, 'doujou', 'completions'), (docSnapshot) => {
                    if (docSnapshot.exists()) {
                        const data = docSnapshot.data();
                        if (data.updatedBy !== currentUser.email) {
                            completions = data.list || [];
                            updateBalance();
                            updateHistory();
                            updateTodaySummary();
                            updateDebtDisplay();
                        }
                    }
                });
                unsubscribeFunctions.push(unsubscribeCompletions);

                const unsubscribePayments = onSnapshot(doc(db, 'doujou', 'payments'), (docSnapshot) => {
                    if (docSnapshot.exists()) {
                        const data = docSnapshot.data();
                        if (data.updatedBy !== currentUser.email) {
                            payments = data.list || [];
                            updateHistory();
                            updateDebtDisplay();
                        }
                    }
                });
                unsubscribeFunctions.push(unsubscribePayments);

                console.log('✅ 實時監聽器設置完成');
                
            } catch (error) {
                console.error('❌ 實時監聽器設置失敗:', error);
            }
        }

        // 💾 本地備份
        function saveLocalBackup() {
            localStorage.setItem('doujou_tasks', JSON.stringify(tasks));
            localStorage.setItem('doujou_completions', JSON.stringify(completions));
            localStorage.setItem('doujou_payments', JSON.stringify(payments));
        }

        function loadLocalBackup() {
            tasks = JSON.parse(localStorage.getItem('doujou_tasks')) || getDefaultTasks();
            completions = JSON.parse(localStorage.getItem('doujou_completions')) || [];
            payments = JSON.parse(localStorage.getItem('doujou_payments')) || [];
        }

        // 🏠 預設任務
        function getDefaultTasks() {
            return [
                { id: '1', name: '洗碗修行', points: 5.0 },
                { id: '2', name: '倒垃圾冥想', points: 3.0 },
                { id: '3', name: '掃地禪修', points: 8.0 },
                { id: '4', name: '洗衣靜心', points: 12.0 },
                { id: '5', name: '整理空間', points: 15.0 }
            ];
        }

        // 🔧 工具函數
        function generateId() {
            return Date.now().toString() + Math.random().toString(36).substr(2, 9);
        }

        function formatDateTime(dateTime) {
            const date = new Date(dateTime);
            return date.toLocaleString('zh-HK', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        // 🎯 核心功能函數
        function switchTab(tabName) {
            document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            
            event.target.closest('.tab').classList.add('active');
            document.getElementById(tabName).classList.add('active');
            
            if (tabName === 'payment') {
                updateDebtDisplay();
            }
        }

        function addTask() {
            const name = document.getElementById('taskName').value.trim();
            const points = parseFloat(document.getElementById('taskPoints').value);

            if (!name) {
                showError('請輸入修行項目名稱');
                return;
            }

            if (!points || points <= 0) {
                showError('請輸入有效的獎金金額');
                return;
            }

            const task = {
                id: generateId(),
                name,
                points,
                createdBy: currentUser.email,
                createdAt: new Date().toISOString()
            };

            tasks.push(task);
            
            document.getElementById('taskName').value = '';
            document.getElementById('taskPoints').value = '5.0';
            
            updateTaskList();
            saveToFirebase();
            showSuccess('修行項目新增成功！');
        }

        function deleteTask(taskId) {
            if (!confirm('確定要刪除這個修行項目嗎？相關的完成記錄也會被刪除。')) {
                return;
            }

            tasks = tasks.filter(task => task.id !== taskId);
            completions = completions.filter(completion => completion.taskId !== taskId);
            
            updateTaskList();
            updateBalance();
            updateHistory();
            updateTodaySummary();
            updateDebtDisplay();
            saveToFirebase();
            
            showSuccess('修行項目已刪除！');
        }

        function completeTask(taskId, completedBy) {
            if (!currentUser) {
                showError('請先登入道場');
                return;
            }

            const task = tasks.find(t => t.id === taskId);
            if (!task) {
                showError('找不到該修行項目');
                return;
            }

            const completion = {
                id: generateId(),
                taskId: taskId,
                completedBy: completedBy,
                completedAt: new Date().toISOString(),
                points: task.points,
                recordedBy: currentUser.email
            };

            completions.push(completion);
            
            updateTaskList();
            updateBalance();
            updateHistory();
            updateTodaySummary();
            updateDebtDisplay();
            saveToFirebase();
            
            showSuccess(`${completedBy} 完成「${task.name}」，獲得 $${task.points}！✨`);
        }

        function setTransfer(from, to) {
            document.querySelectorAll('.quick-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            
            document.getElementById('paymentFrom').value = from;
            document.getElementById('paymentTo').value = to;
        }

        function recordPayment() {
            const from = document.getElementById('paymentFrom').value;
            const to = document.getElementById('paymentTo').value;
            const amount = parseFloat(document.getElementById('paymentAmount').value);

            if (!from || !to) {
                showError('請選擇轉賬人和收款人');
                return;
            }

            if (from === to) {
                showError('轉賬人和收款人不能是同一人');
                return;
            }

            if (!amount || amount <= 0) {
                showError('請輸入有效轉賬金額');
                return;
            }

            const payment = {
                id: generateId(),
                from: from,
                to: to,
                amount: amount,
                date: new Date().toISOString(),
                reason: '修行金結算轉賬',
                recordedBy: currentUser.email
            };

            payments.push(payment);
            
            document.getElementById('paymentFrom').value = '';
            document.getElementById('paymentTo').value = '';
            document.getElementById('paymentAmount').value = '';
            
            document.querySelectorAll('.quick-btn').forEach(btn => btn.classList.remove('active'));
            
            updateBalance();
            updateHistory();
            updateDebtDisplay();
            saveToFirebase();
            
            showSuccess(`✅ 記錄轉賬：${from} → ${to} $${amount.toFixed(2)}`);
        }

        // 🔄 界面更新函數
        function updateUI() {
            if (!currentUser) return;
            
            updateTaskList();
            updateBalance();
            updateHistory();
            updateDebtDisplay();
            updateTodaySummary();
        }

        function updateTodaySummary() {
            const today = new Date().toDateString();
            const todayCompletions = completions.filter(c => new Date(c.completedAt).toDateString() === today);
            
            // 子謙 今日總結
            const ziqianToday = todayCompletions.filter(c => c.completedBy === '子謙');
            const ziqianTasksEl = document.getElementById('ziqianTodayTasks');
            const ziqianCountEl = document.getElementById('ziqianTaskCount');
            const ziqianEarnedEl = document.getElementById('ziqianEarnedToday');
            
            if (ziqianToday.length > 0) {
                const taskNames = ziqianToday.map(c => {
                    const task = tasks.find(t => t.id === c.taskId);
                    return task ? task.name : '未知項目';
                }).slice(0, 3);
                
                ziqianTasksEl.textContent = taskNames.join('、') + (ziqianToday.length > 3 ? '...' : '');
                ziqianCountEl.textContent = `${ziqianToday.length}項任務`;
                
                const earned = ziqianToday.reduce((sum, c) => sum + c.points, 0);
                ziqianEarnedEl.textContent = `+$${earned.toFixed(2)}`;
            } else {
                ziqianTasksEl.textContent = '今日還未開始修行';
                ziqianCountEl.textContent = '0項任務';
                ziqianEarnedEl.textContent = '$0.00';
            }
            
            // 小亂 今日總結
            const xiaoluanToday = todayCompletions.filter(c => c.completedBy === '小亂');
            const xiaoluanTasksEl = document.getElementById('xiaoluanTodayTasks');
            const xiaoluanCountEl = document.getElementById('xiaoluanTaskCount');
            const xiaoluanEarnedEl = document.getElementById('xiaoluanEarnedToday');
            
            if (xiaoluanToday.length > 0) {
                const taskNames = xiaoluanToday.map(c => {
                    const task = tasks.find(t => t.id === c.taskId);
                    return task ? task.name : '未知項目';
                }).slice(0, 3);
                
                xiaoluanTasksEl.textContent = taskNames.join('、') + (xiaoluanToday.length > 3 ? '...' : '');
                xiaoluanCountEl.textContent = `${xiaoluanToday.length}項任務`;
                
                const earned = xiaoluanToday.reduce((sum, c) => sum + c.points, 0);
                xiaoluanEarnedEl.textContent = `+$${earned.toFixed(2)}`;
            } else {
                xiaoluanTasksEl.textContent = '今日還未開始修行';
                xiaoluanCountEl.textContent = '0項任務';
                xiaoluanEarnedEl.textContent = '$0.00';
            }
        }

        function updateTaskList() {
            const taskListEl = document.getElementById('taskList');
            if (!taskListEl) return;
            
            if (tasks.length === 0) {
                taskListEl.innerHTML = '<p style="text-align: center; color: #A9790B; font-style: italic;">暫無修行項目，請先新增一些任務！</p>';
                return;
            }
            
            taskListEl.innerHTML = tasks.map(task => {
                const taskCompletions = completions.filter(c => c.taskId === task.id);
                const today = new Date().toDateString();
                const todayCompletions = taskCompletions.filter(c => new Date(c.completedAt).toDateString() === today);
                
                const ziqianToday = todayCompletions.filter(c => c.completedBy === '子謙').length;
                const xiaoluanToday = todayCompletions.filter(c => c.completedBy === '小亂').length;
                
                return `
                    <div class="task-item">
                        <div class="task-info">
                            <div class="task-name">${task.name}</div>
                            <div class="task-completion-status">
                                今日完成：
                                ${ziqianToday > 0 ? `<span class="completion-count">子謙 ${ziqianToday}次</span>` : ''}
                                ${xiaoluanToday > 0 ? `<span class="completion-count">小亂 ${xiaoluanToday}次</span>` : ''}
                                ${ziqianToday === 0 && xiaoluanToday === 0 ? '尚未完成' : ''}
                            </div>
                        </div>
                        <div class="task-actions">
                            <div class="money-badge">$${task.points}</div>
                            <button class="complete-btn" onclick="completeTask('${task.id}', '子謙')">子謙完成</button>
                            <button class="complete-btn" onclick="completeTask('${task.id}', '小亂')">小亂完成</button>
                            <button class="delete-btn" onclick="deleteTask('${task.id}')">🗑️</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function updateBalance() {
            // 計算總收入
            const ziqianTotal = completions.filter(c => c.completedBy === '子謙').reduce((sum, c) => sum + c.points, 0);
            const xiaoluanTotal = completions.filter(c => c.completedBy === '小亂').reduce((sum, c) => sum + c.points, 0);
            
            // 計算轉賬調整
            const ziqianReceived = payments.filter(p => p.to === '子謙').reduce((sum, p) => sum + p.amount, 0);
            const ziqianPaid = payments.filter(p => p.from === '子謙').reduce((sum, p) => sum + p.amount, 0);
            const xiaoluanReceived = payments.filter(p => p.to === '小亂').reduce((sum, p) => sum + p.amount, 0);
            const xiaoluanPaid = payments.filter(p => p.from === '小亂').reduce((sum, p) => sum + p.amount, 0);
            
            // 計算最終餘額
            const ziqianBalance = ziqianTotal + ziqianReceived - ziqianPaid;
            const xiaoluanBalance = xiaoluanTotal + xiaoluanReceived - xiaoluanPaid;
            
            // 更新顯示
            document.getElementById('ziqianBalance').textContent = `$${ziqianBalance.toFixed(2)}`;
            document.getElementById('xiaoluanBalance').textContent = `$${xiaoluanBalance.toFixed(2)}`;
        }

        function updateDebtDisplay() {
            // 計算餘額
            const ziqianTotal = completions.filter(c => c.completedBy === '子謙').reduce((sum, c) => sum + c.points, 0);
            const xiaoluanTotal = completions.filter(c => c.completedBy === '小亂').reduce((sum, c) => sum + c.points, 0);
            
            const ziqianReceived = payments.filter(p => p.to === '子謙').reduce((sum, p) => sum + p.amount, 0);
            const ziqianPaid = payments.filter(p => p.from === '子謙').reduce((sum, p) => sum + p.amount, 0);
            const xiaoluanReceived = payments.filter(p => p.to === '小亂').reduce((sum, p) => sum + p.amount, 0);
            const xiaoluanPaid = payments.filter(p => p.from === '小亂').reduce((sum, p) => sum + p.amount, 0);
            
            const ziqianBalance = ziqianTotal + ziqianReceived - ziqianPaid;
            const xiaoluanBalance = xiaoluanTotal + xiaoluanReceived - xiaoluanPaid;
            
            const diff = ziqianBalance - xiaoluanBalance;
            const debtEl = document.getElementById('debtDisplay');
            
            if (Math.abs(diff) < 0.01) {
                debtEl.textContent = '🎯 帳目已結清！';
                debtEl.className = 'debt-display';
            } else if (diff > 0) {
                debtEl.textContent = `小亂 欠 子謙 $${diff.toFixed(2)}`;
                debtEl.className = 'debt-display debt-negative';
            } else {
                debtEl.textContent = `子謙 欠 小亂 $${Math.abs(diff).toFixed(2)}`;
                debtEl.className = 'debt-display debt-positive';
            }
        }

        function updateHistory() {
            // 更新完成記錄
            const completionHistoryEl = document.getElementById('completionHistory');
            if (completionHistoryEl) {
                const recentCompletions = completions.slice(-20).reverse();
                completionHistoryEl.innerHTML = recentCompletions.map(completion => {
                    const task = tasks.find(t => t.id === completion.taskId);
                    const taskName = task ? task.name : '已刪除的任務';
                    return `
                        <div class="history-item">
                            <div class="history-info">
                                ${completion.completedBy} 完成「${taskName}」 (+$${completion.points})
                            </div>
                            <div class="history-time">${formatDateTime(completion.completedAt)}</div>
                        </div>
                    `;
                }).join('') || '<p style="text-align: center; color: #A9790B; font-style: italic;">暫無修行記錄</p>';
            }
            
            // 更新轉賬記錄
            const paymentHistoryEl = document.getElementById('paymentHistory');
            if (paymentHistoryEl) {
                const recentPayments = payments.slice(-20).reverse();
                paymentHistoryEl.innerHTML = recentPayments.map(payment => `
                    <div class="history-item">
                        <div class="history-info">
                            ${payment.from} → ${payment.to}: $${payment.amount.toFixed(2)}
                            <small style="display: block; color: #8D6E63;">${payment.reason}</small>
                        </div>
                        <div class="history-time">${formatDateTime(payment.date)}</div>
                    </div>
                `).join('') || '<p style="text-align: center; color: #A9790B; font-style: italic;">暫無轉賬記錄</p>';
            }
        }

        // 🚨 系統函數
        function showLoading(message = '載入中...') {
            document.getElementById('loadingText').textContent = message;
            document.getElementById('loadingScreen').style.display = 'flex';
        }

        function hideLoading() {
            document.getElementById('loadingScreen').style.display = 'none';
        }

        function showSuccess(message) {
            const alert = document.createElement('div');
            alert.className = 'alert alert-success';
            alert.textContent = message;
            document.body.appendChild(alert);
            setTimeout(() => alert.remove(), 3000);
        }

        function showError(message) {
            const alert = document.createElement('div');
            alert.className = 'alert alert-error';
            alert.textContent = message;
            document.body.appendChild(alert);
            setTimeout(() => alert.remove(), 5000);
        }

        function updateSyncStatus(status) {
            const syncEl = document.getElementById('syncStatus');
            syncEl.textContent = status;
            
            syncEl.classList.remove('sync-error');
            if (status.includes('❌') || status.includes('失敗')) {
                syncEl.classList.add('sync-error');
            }
        }

        async function logout() {
            if (confirm('確定要離開道場嗎？')) {
                try {
                    const { signOut } = window.firebaseModules;
                    
                    unsubscribeFunctions.forEach(unsubscribe => unsubscribe());
                    unsubscribeFunctions = [];
                    
                    await signOut(auth);
                    currentUser = null;
                    showLoginScreen();
                    updateSyncStatus('🔄 連接中...');
                } catch (error) {
                    console.error('登出失敗:', error);
                    showError('登出失敗');
                }
            }
        }

        async function resetData() {
            if (!confirm('⚠️ 確定要重置道場所有資料嗎？此操作無法復原！')) {
                return;
            }
            
            if (!confirm('🚨 最後確認：這將刪除所有修行項目、完成記錄和轉賬記錄！')) {
                return;
            }
            
            tasks = [];
            completions = [];
            payments = [];
            
            updateUI();
            await saveToFirebase();
            showSuccess('道場資料已重置');
        }

        // 🚀 應用初始化
        document.addEventListener('DOMContentLoaded', async function() {
            console.log('🏮 亂道場の修行列表啟動中...');
            
            showLoading('初始化 Firebase...');
            
            let retryCount = 0;
            const maxRetries = 50;
            
            const waitForFirebase = () => {
                return new Promise((resolve, reject) => {
                    const checkModules = () => {
                        if (window.firebaseModules) {
                            resolve();
                        } else if (retryCount < maxRetries) {
                            retryCount++;
                            setTimeout(checkModules, 100);
                        } else {
                            reject(new Error('Firebase modules 載入超時'));
                        }
                    };
                    checkModules();
                });
            };
            
            try {
                await waitForFirebase();
                await initializeFirebase();
                hideLoading();
            } catch (error) {
                console.error('初始化失敗:', error);
                hideLoading();
                updateSyncStatus('❌ 初始化失敗');
                showError('應用初始化失敗: ' + error.message);
            }
        });
    </script>
</body>
</html>
